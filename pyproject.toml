[project]
name = "pdd-agent"
version = "0.1.0"
description = "Test case generation agent for PDD pull requests"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "javalang>=0.13.0",
    "pyjwt>=2.15.1",
    "pyyaml>=6.0.3",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pytest>=8.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.8",
]

[project.scripts]
pdd-agent = "pdd_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdd_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["pdd_agent.config.schema._opt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["pdd_agent"]
branch = true

[tool.coverage.report]
show_missing = true

# Architecture: api -> service -> agents -> ports <- (llm, integrations, storage); domain and
# config sit at the bottom. See "Architecture" in README.md. Checked by `uv run lint-imports`
# and by tests/test_architecture.py.
[tool.importlinter]
root_package = "pdd_agent"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers only depend downwards"
type = "layers"
layers = [
    "pdd_agent.__main__",
    "pdd_agent.cli",
    "pdd_agent.api",
    "pdd_agent.service",
    "pdd_agent.agents | pdd_agent.llm | pdd_agent.integrations | pdd_agent.storage",
    "pdd_agent.ports",
    "pdd_agent.domain | pdd_agent.config",
]

[[tool.importlinter.contracts]]
name = "Agents know only domain, ports and themselves"
type = "forbidden"
source_modules = ["pdd_agent.agents"]
forbidden_modules = [
    "pdd_agent.api",
    "pdd_agent.service",
    "pdd_agent.storage",
    "pdd_agent.integrations",
    "pdd_agent.llm",
    "pdd_agent.config",
    "fastapi",
    "starlette",
    "httpx",
    "sqlite3",
    "jwt",
    "yaml",
    "uvicorn",
]

[[tool.importlinter.contracts]]
name = "Domain and ports are free of frameworks and infrastructure"
type = "forbidden"
source_modules = ["pdd_agent.domain", "pdd_agent.ports"]
forbidden_modules = [
    "pdd_agent.config",
    "fastapi",
    "starlette",
    "httpx",
    "sqlite3",
    "jwt",
    "yaml",
    "uvicorn",
]

[[tool.importlinter.contracts]]
name = "Domain depends on no other layer"
type = "forbidden"
source_modules = ["pdd_agent.domain"]
forbidden_modules = [
    "pdd_agent.ports",
    "pdd_agent.agents",
    "pdd_agent.llm",
    "pdd_agent.integrations",
    "pdd_agent.storage",
    "pdd_agent.service",
    "pdd_agent.api",
]
